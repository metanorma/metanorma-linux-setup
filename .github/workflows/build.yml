name: build

on:
  push:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Shellcheck lint
        run: |
          sudo apt install shellcheck
          shellcheck *.sh

  ubuntu-snapd-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - name: Prerequisites
      run: |
        sudo apt update
        sudo apt install -y curl
    - name: Run Metanorma Ubuntu install script
      env:
        JAVA_OPTS: java.awt.headless=true
      run: |
        sudo -H ./ubuntu.sh
        which xml2rfc

  ubuntu-test:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:latest
    steps:
    - uses: actions/checkout@v1
    - name: Prerequisites
      run: |
        apt update
        apt install -y curl
    - name: Run Metanorma Ubuntu install script
      env:
        JAVA_OPTS: java.awt.headless=true
        DEBIAN_FRONTEND: noninteractive
      run: |
        ./ubuntu.sh
        which xml2rfc
    - name: Install gems
      run: |
        env USE_RVM=false ./install-gems.sh
        which metanorma

